name: Daily Crypto Bot Execution

on:
  schedule:
    # Jam 00:00 UTC = Jam 07:00 WIB
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  run-crypto-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Execute Main Script
        run: python main.py
